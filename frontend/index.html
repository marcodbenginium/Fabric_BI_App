<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabric Data Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --primary:   #0078d4;
      --primary-h: #106ebe;
      --user-bg:   #0078d4;
      --agent-bg:  #ffffff;
      --border:    #e1e4e8;
      --text:      #1a1a2e;
      --text-muted:#6b7280;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1rem;
    }

    .header-brand svg { color: var(--primary); }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .875rem;
      color: var(--text-muted);
    }

    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      transition: background .15s;
    }

    .btn-primary    { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-outline    { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }

    /* ── Login screen ────────────────────────────────────────────────────── */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .login-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .login-card p  { color: var(--text-muted); margin-bottom: 28px; font-size: .9rem; }

    .login-card .btn { width: 100%; padding: 12px; font-size: 1rem; }

    /* ── Chat screen ─────────────────────────────────────────────────────── */
    #chat-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Message bubbles ─────────────────────────────────────────────────── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 78%;
    }

    .message.user   { align-self: flex-end; flex-direction: row-reverse; }
    .message.agent  { align-self: flex-start; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user  .avatar { background: var(--primary); color: #fff; }
    .message.agent .avatar { background: #e8f0fe; color: var(--primary); font-size: 1rem; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: .95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user  .bubble { background: var(--user-bg); color: #fff; border-bottom-right-radius: 4px; }
    .message.agent .bubble { background: var(--agent-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

    /* ── Typing indicator ────────────────────────────────────────────────── */
    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
    .typing-indicator span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      opacity: .4;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ─────────────────────────────────────────────────────── */
    .input-area {
      padding: 14px 0 20px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      box-shadow: var(--shadow);
    }

    #prompt-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: .95rem;
      font-family: inherit;
      background: transparent;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
      color: var(--text);
    }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background .15s;
    }

    #send-btn:hover:not(:disabled) { background: var(--primary-h); }
    #send-btn:disabled { opacity: .45; cursor: default; }

    .input-hint { font-size: .78rem; color: var(--text-muted); margin-top: 6px; text-align: center; }

    /* ── Error alert ─────────────────────────────────────────────────────── */
    .alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: .875rem;
      color: #b91c1c;
    }

    /* ── Chart bubble ────────────────────────────────────────────────────── */
    .chart-bubble {
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      padding: 16px;
      width: 480px;
      max-width: 88vw;
    }

    .chart-title {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      text-align: center;
    }

    .chart-container {
      position: relative;
      height: 260px;
    }

    /* ── Utilities ───────────────────────────────────────────────────────── */
    .hidden { display: none !important; }

    /* ── Toolbar azioni conversazione ───────────────────────────────────── */
    .chat-toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 0 4px;
      flex-shrink: 0;
    }
    .btn-toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-toolbar:hover:not(:disabled) { background: var(--bg); color: var(--text); }
    .btn-toolbar:disabled { opacity: .4; cursor: default; }
    .btn-toolbar svg { flex-shrink: 0; }

    /* ── Tab navigation ─────────────────────────────────────────────────── */
    #tab-nav {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      flex-shrink: 0;
    }
    .tab-nav-inner {
      display: flex;
      max-width: 860px;
      margin: 0 auto;
    }
    .tab-btn {
      padding: 11px 18px;
      border: none;
      background: transparent;
      font-size: .875rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active   { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-btn:hover:not(.active) { color: var(--text); }
    .tab-badge {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      font-size: .7rem;
      padding: 1px 6px;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    /* ── Dashboard screen ───────────────────────────────────────────────── */
    #dashboard-screen {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 32px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .dashboard-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .dashboard-grid {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 20px;
    }
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      /* resize nativo del browser */
      resize: both;
      overflow: hidden;
      width: 440px;
      min-width: 280px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: box-shadow .15s;
    }
    .widget-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      flex-shrink: 0;
      user-select: none;
    }
    .widget-card-title {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text);
    }
    .widget-card-meta {
      font-size: .72rem;
      color: var(--text-muted);
    }
    .widget-card-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: .85rem;
      line-height: 1;
      transition: background .12s, color .12s;
    }
    .widget-card-remove:hover { color: #dc2626; background: #fef2f2; }
    .widget-card-body {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: 16px;
    }
    .dashboard-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 64px 20px;
      font-size: .95rem;
    }
    .dashboard-empty svg { margin-bottom: 14px; opacity: .35; }

    /* ── Drag & drop ────────────────────────────────────────────────────── */
    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 1rem;
      line-height: 1;
      transition: color .12s, background .12s;
    }
    .drag-handle:hover { color: var(--primary); background: #eff6ff; }
    .drag-handle:active { cursor: grabbing; }
    .widget-card.is-dragging { opacity: .35; box-shadow: none; }
    .widget-card.drag-over   { outline: 2px dashed var(--primary); outline-offset: -2px; }

    /* ── Pin button (in chart bubble) ───────────────────────────────────── */
    .btn-pin {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: .78rem;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn-pin:hover:not(.pinned) { background: #eff6ff; color: var(--primary); border-color: var(--primary); }
    .btn-pin.pinned { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; cursor: default; }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="header-brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    Fabric Data Agent
  </div>
  <div class="header-user">
    <span id="user-name" class="hidden"></span>
    <button id="logout-btn" class="btn btn-outline hidden" onclick="logout()">Esci</button>
  </div>
</header>

<!-- ── Tab navigation (visibile solo quando autenticati) ─────────────────── -->
<div id="tab-nav">
  <div class="tab-nav-inner">
    <button class="tab-btn active" id="tab-chat" onclick="switchTab('chat')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Chat
    </button>
    <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
      <span class="tab-badge hidden" id="dashboard-badge">0</span>
    </button>
  </div>
</div>

<!-- ── Login screen ────────────────────────────────────────────────────────── -->
<div id="login-screen" class="hidden">
  <div class="login-card">
    <h2>Benvenuto</h2>
    <p>Accedi con il tuo account aziendale per interrogare i modelli semantici tramite l'agente Fabric.</p>
    <button class="btn btn-primary" onclick="login()">Accedi con Microsoft</button>
  </div>
</div>

<!-- ── Chat screen ─────────────────────────────────────────────────────────── -->
<div id="chat-screen" class="hidden">
  <div class="chat-toolbar" id="chat-toolbar" style="display:none">
    <button class="btn-toolbar" onclick="requestSummary()" id="btn-summary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
      Riassumi
    </button>
    <button class="btn-toolbar" onclick="exportPdf()" id="btn-pdf">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Esporta PDF
    </button>
    <button class="btn-toolbar" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
      Nuova chat
    </button>
  </div>
  <div id="messages"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="prompt-input"
        placeholder="Chiedi qualcosa ai tuoi dati… (es. «Qual è il fatturato del Q1?»)"
        rows="1"
        onkeydown="handleKeydown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Invia (Ctrl+Invio)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Ctrl + Invio per inviare &nbsp;·&nbsp; RLS rispettata</p>
  </div>
</div>

<!-- ── Dashboard screen ────────────────────────────────────────────────────── -->
<div id="dashboard-screen" class="hidden">
  <div class="dashboard-header">
    <h2>Dashboard grafici</h2>
    <span style="font-size:.8rem;color:var(--text-muted)">Aggiungi grafici dalla chat con il pulsante 📌</span>
  </div>
  <div id="dashboard-grid" class="dashboard-grid"></div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let isLoading = false;
  let lastSummary = '';   // conserva l'ultimo riassunto per il PDF
  const chartDataStore = {};  // chartId → chartData (per il pin)
  const allCharts = {};       // canvasId → Chart instance (per destroy e resize)

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const res  = await fetch('/api/me', { credentials: 'include' });
      const data = await res.json();

      if (data.authenticated) {
        // Azzera history e thread ad ogni caricamento della pagina
        await fetch('/api/chat/reset', { method: 'POST', credentials: 'include' });
        showChat(data.name);
      } else {
        showLogin();
      }
    } catch {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('chat-screen').classList.add('hidden');
  }

  function showChat(name) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('chat-screen').classList.remove('hidden');
    document.getElementById('dashboard-screen').classList.add('hidden');
    document.getElementById('tab-nav').style.display = 'block';
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-name').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');
    updateDashboardBadge();
    addAgentMessage('Ciao! Sono il tuo assistente dati Fabric. Puoi chiedermi informazioni sui dati dei modelli semantici aziendali in linguaggio naturale.\n\nEsempi:\n• "Qual è il fatturato totale del 2024?"\n• "Mostrami i top 5 prodotti per vendite"\n• "Quanti clienti attivi ci sono per regione?"');
  }

  // ── Auth ───────────────────────────────────────────────────────────────────
  function login()  { window.location.href = '/login'; }
  function logout() { window.location.href = '/logout'; }

  // ── Toolbar ────────────────────────────────────────────────────────────────
  function showToolbar() {
    const tb = document.getElementById('chat-toolbar');
    if (tb) tb.style.display = 'flex';
  }

  async function requestSummary() {
    if (isLoading) return;
    setLoading(true);
    try {
      const res  = await fetch('/api/chat/summary', { method: 'POST', credentials: 'include' });
      const data = await res.json();
      if (data.success) {
        lastSummary = data.summary;
        addAgentMessage('📋 Riassunto:\n\n' + data.summary);
      } else {
        addErrorMessage(data.error || 'Errore nel riassunto');
      }
    } catch {
      addErrorMessage('Impossibile generare il riassunto.');
    } finally {
      setLoading(false);
    }
  }

  async function exportPdf() {
    try {
      // Converti ogni canvas Chart.js in PNG base64, nell'ordine in cui appaiono
      const chartCanvases = document.querySelectorAll('.chart-bubble canvas');
      const charts = Array.from(chartCanvases).map(c => c.toDataURL('image/png'));

      const res = await fetch('/api/chat/export-pdf', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary: lastSummary, charts }),
      });
      if (!res.ok) {
        const err = await res.json();
        addErrorMessage(err.error || 'Errore esportazione PDF');
        return;
      }
      const blob     = await res.blob();
      const url      = URL.createObjectURL(blob);
      const a        = document.createElement('a');
      a.href         = url;
      a.download     = `conversazione_${new Date().toISOString().slice(0,10)}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch {
      addErrorMessage('Impossibile scaricare il PDF.');
    }
  }

  async function newChat() {
    await fetch('/api/chat/reset', { method: 'POST', credentials: 'include' });
    lastSummary = '';
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chat-toolbar').style.display = 'none';
    addAgentMessage('Nuova conversazione avviata. Come posso aiutarti?');
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const input  = document.getElementById('prompt-input');
    const prompt = input.value.trim();

    if (!prompt || isLoading) return;

    addUserMessage(prompt);
    input.value = '';
    autoResize(input);
    setLoading(true);

    try {
      const res  = await fetch('/api/chat', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });

      const data = await res.json();

      if (data.type === 'chart' && data.chart_data) {
        addChartMessage(data.chart_data);
        showToolbar();
      } else if (data.success) {
        addAgentMessage(data.response);
        showToolbar();
      } else {
        addErrorMessage(data.error || 'Errore sconosciuto');
      }
    } catch (err) {
      addErrorMessage('Impossibile raggiungere il server. Riprova.');
    } finally {
      setLoading(false);
      document.getElementById('prompt-input').focus();
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function addUserMessage(text) {
    const container = document.getElementById('messages');
    container.insertAdjacentHTML('beforeend', `
      <div class="message user">
        <div class="avatar">Tu</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
    `);
    scrollToBottom();
  }

  function addChartMessage(chartData) {
    removeTypingIndicator();
    const chartId = `chart_${Date.now()}`;
    chartDataStore[chartId] = chartData;   // salva per il pin
    const container = document.getElementById('messages');
    container.insertAdjacentHTML('beforeend', `
      <div class="message agent">
        <div class="avatar">🤖</div>
        <div class="chart-bubble">
          <div class="chart-title">${escapeHtml(chartData.title || 'Grafico')}</div>
          <div class="chart-container">
            <canvas id="${chartId}"></canvas>
          </div>
          <button class="btn-pin" id="pin_${chartId}" onclick="pinChart('${chartId}')">
            📌 Aggiungi alla dashboard
          </button>
        </div>
      </div>
    `);
    scrollToBottom();
    renderChart(chartId, chartData);
  }

  const COLORS = [
    '#0078d4', '#10b981', '#f59e0b', '#ef4444',
    '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16',
  ];

  function renderChart(canvasId, chartData) {
    // Distruggi istanza precedente se presente (ridisegno dopo resize o reload)
    if (allCharts[canvasId]) {
      allCharts[canvasId].destroy();
      delete allCharts[canvasId];
    }
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const { chartType, data, xKey } = chartData;
    if (!data || data.length === 0) return;

    const labels = data.map(row => row[xKey] ?? Object.values(row)[0]);

    // Determina le chiavi numeriche (tutto tranne xKey)
    const valueKeys = Object.keys(data[0]).filter(k => k !== xKey);

    let datasets;

    if (chartType === 'pie') {
      datasets = [{
        data: data.map(row => row[valueKeys[0]] ?? Object.values(row)[1]),
        backgroundColor: COLORS.slice(0, data.length),
        borderWidth: 1,
        borderColor: '#fff',
      }];
    } else {
      datasets = valueKeys.map((key, i) => ({
        label: key,
        data: data.map(row => row[key]),
        backgroundColor: chartType === 'line' ? 'transparent' : COLORS[i % COLORS.length] + '99',
        borderColor: COLORS[i % COLORS.length],
        borderWidth: 2,
        pointRadius: chartType === 'line' ? 4 : 0,
        fill: chartType === 'area',
        tension: 0.3,
      }));
    }

    const type = chartType === 'area' ? 'line' : chartType;

    new Chart(canvas, {
      type,
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: chartType === 'pie' || valueKeys.length > 1,
            position: 'bottom',
            labels: { font: { size: 11 }, padding: 12 },
          },
          tooltip: { mode: 'index', intersect: false },
        },
        scales: chartType === 'pie' ? {} : {
          x: { grid: { color: '#f0f2f5' }, ticks: { font: { size: 11 } } },
          y: { grid: { color: '#f0f2f5' }, ticks: { font: { size: 11 } }, beginAtZero: true },
        },
      },
    });
    allCharts[canvasId] = Chart.getChart(canvas);
  }

  function addAgentMessage(text) {
    removeTypingIndicator();
    const container = document.getElementById('messages');
    container.insertAdjacentHTML('beforeend', `
      <div class="message agent">
        <div class="avatar">🤖</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
    `);
    scrollToBottom();
  }

  function addErrorMessage(text) {
    removeTypingIndicator();
    const container = document.getElementById('messages');
    container.insertAdjacentHTML('beforeend', `
      <div class="message agent">
        <div class="avatar">🤖</div>
        <div class="bubble"><div class="alert">⚠️ ${escapeHtml(text)}</div></div>
      </div>
    `);
    scrollToBottom();
  }

  function showTypingIndicator() {
    const container = document.getElementById('messages');
    container.insertAdjacentHTML('beforeend', `
      <div class="message agent" id="typing">
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    `);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    document.getElementById('typing')?.remove();
  }

  function setLoading(state) {
    isLoading = state;
    const btn = document.getElementById('send-btn');
    btn.disabled = state;
    if (state) showTypingIndicator();
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKeydown(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Dashboard ───────────────────────────────────────────────────────────────
  function switchTab(tab) {
    const isChat = tab === 'chat';
    document.getElementById('chat-screen').classList.toggle('hidden', !isChat);
    document.getElementById('dashboard-screen').classList.toggle('hidden', isChat);
    document.getElementById('tab-chat').classList.toggle('active', isChat);
    document.getElementById('tab-dashboard').classList.toggle('active', !isChat);
    if (!isChat) loadDashboard();
  }

  async function updateDashboardBadge() {
    try {
      const res = await fetch('/api/dashboard', { credentials: 'include' });
      const widgets = await res.json();
      const badge = document.getElementById('dashboard-badge');
      if (widgets.length > 0) {
        badge.textContent = widgets.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    } catch {}
  }

  async function pinChart(chartId) {
    const chartData = chartDataStore[chartId];
    if (!chartData) return;
    const btn = document.getElementById(`pin_${chartId}`);
    if (btn) { btn.disabled = true; btn.textContent = 'Salvataggio…'; }
    try {
      const res = await fetch('/api/dashboard', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chart_data: chartData }),
      });
      if (res.ok) {
        if (btn) {
          btn.classList.add('pinned');
          btn.textContent = '✓ Aggiunto alla dashboard';
          btn.disabled = true;
        }
        updateDashboardBadge();
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '📌 Aggiungi alla dashboard'; }
      }
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = '📌 Aggiungi alla dashboard'; }
    }
  }

  async function loadDashboard() {
    const grid = document.getElementById('dashboard-grid');
    grid.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Caricamento…</p>';
    try {
      const res = await fetch('/api/dashboard', { credentials: 'include' });
      const widgets = await res.json();
      renderDashboardGrid(widgets);
    } catch {
      grid.innerHTML = '<p class="dashboard-empty">Errore nel caricamento.</p>';
    }
  }

  function renderDashboardGrid(widgets) {
    const grid = document.getElementById('dashboard-grid');
    if (widgets.length === 0) {
      grid.innerHTML = `
        <div class="dashboard-empty" style="width:100%">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><br>
          Nessun grafico salvato.<br>Chiedi un grafico in chat e clicca <strong>📌 Aggiungi alla dashboard</strong>.
        </div>`;
      return;
    }

    // Applica eventuale ordine salvato in localStorage
    const storedOrder = JSON.parse(localStorage.getItem('dashboard_order') || '[]');
    if (storedOrder.length) {
      widgets.sort((a, b) => {
        const ia = storedOrder.indexOf(a.id);
        const ib = storedOrder.indexOf(b.id);
        return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
      });
    }

    grid.innerHTML = '';
    widgets.forEach(w => {
      const cardId  = `dcard_${w.id.replace(/-/g, '')}`;
      const canvasId = `dcanvas_${w.id.replace(/-/g, '')}`;
      const date = new Date(w.created_at).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
      grid.insertAdjacentHTML('beforeend', `
        <div class="widget-card" id="${cardId}" data-widget-id="${w.id}">
          <div class="widget-card-header">
            <span class="drag-handle" title="Trascina per spostare">⠿</span>
            <div style="flex:1;min-width:0;margin-left:8px">
              <div class="widget-card-title">${escapeHtml(w.title)}</div>
              <div class="widget-card-meta">${date}</div>
            </div>
            <button class="widget-card-remove" onclick="removeWidget('${w.id}','${cardId}')" title="Rimuovi">✕</button>
          </div>
          <div class="widget-card-body">
            <canvas id="${canvasId}"></canvas>
          </div>
        </div>
      `);

      const card = document.getElementById(cardId);

      // ── Drag & drop ────────────────────────────────────────────────────
      const handle = card.querySelector('.drag-handle');
      handle.addEventListener('pointerdown', () => card.setAttribute('draggable', 'true'));
      card.addEventListener('dragstart', e => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', cardId);
        setTimeout(() => card.classList.add('is-dragging'), 0);
      });
      card.addEventListener('dragend', () => {
        card.setAttribute('draggable', 'false');
        card.classList.remove('is-dragging');
        document.querySelectorAll('.widget-card').forEach(c => c.classList.remove('drag-over'));
        // Persisti ordine
        const ids = [...grid.querySelectorAll('.widget-card')].map(c => c.dataset.widgetId);
        localStorage.setItem('dashboard_order', JSON.stringify(ids));
      });
      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const dragging = document.querySelector('.widget-card.is-dragging');
        if (dragging && dragging !== card) card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', e => {
        e.preventDefault();
        card.classList.remove('drag-over');
        const srcId  = e.dataTransfer.getData('text/plain');
        const srcEl  = document.getElementById(srcId);
        if (srcEl && srcEl !== card) {
          const allCards = [...grid.querySelectorAll('.widget-card')];
          const srcIdx   = allCards.indexOf(srcEl);
          const dstIdx   = allCards.indexOf(card);
          grid.insertBefore(srcEl, srcIdx < dstIdx ? card.nextSibling : card);
        }
      });

      // ── ResizeObserver: ridisegna il grafico al resize della card ──────
      const observer = new ResizeObserver(() => {
        const chart = allCharts[canvasId];
        if (chart) chart.resize();
      });
      observer.observe(card);

      // Render grafico
      requestAnimationFrame(() => renderChart(canvasId, w.chart_data));
    });
    updateDashboardBadge();
  }

  async function removeWidget(id, cardId) {
    document.getElementById(cardId)?.remove();
    try {
      await fetch(`/api/dashboard/${id}`, { method: 'DELETE', credentials: 'include' });
    } catch {}
    updateDashboardBadge();
    // se rimane vuoto, mostra empty state
    const grid = document.getElementById('dashboard-grid');
    if (grid && grid.children.length === 0) {
      renderDashboardGrid([]);
    }
  }

  // ── Bootstrap ──────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
